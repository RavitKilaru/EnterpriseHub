services:
  django:
    container_name: enterprisehub
    image: ghcr.io/RavitKilaru/enterprisehub:latest

    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - static_volume:/vol/static
      - media_volume:/vol/media

    networks:
      - enterprisehub-network

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: enterprisehub-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - enterprisehub-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: enterprisehub-redis

    command: redis-server --appendonly yes

    expose:
      - "6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - enterprisehub-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    
    restart: unless-stopped

  celery-worker:
    image: ghcr.io/ravitkilaru/enterprisehub:latest
    container_name: enterprisehub-celery-worker
    command: celery -A config worker -l info

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - enterprisehub-network

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    restart: unless-stopped

  celery-beat:
    image: ghcr.io/ravitkilaru/enterprisehub:latest
    container_name: enterprisehub-celery-beat
    command: celery -A config beat -l info

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - enterprisehub-network

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    restart: unless-stopped

  nginx:
    build:
      context: ./nginx

    container_name: enterprisehub-nginx

    ports:
      - "80:80"

    depends_on:
      - django

    volumes:
      - static_volume:/vol/static
      - media_volume:/vol/media

    networks:
      - enterprisehub-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    restart: unless-stopped

volumes:

  postgres_data:
  redis_data:
  static_volume:
  media_volume:


networks:
  enterprisehub-network:
    driver: bridge