services:
  django:
    container_name: enterprisehub

    build:
      context: .
      dockerfile: docker/Dockerfile

    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - static_volume:/vol/static
      - media_volume:/vol/media

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: enterprisehub-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    container_name: enterprisehub-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: enterprisehub-celery-worker

    command: celery -A config worker -l info

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: enterprisehub-celery-beat

    command: celery -A config beat -l info

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

  nginx:
    build:
      context: ./nginx

    container_name: enterprisehub-nginx

    ports:
      - "80:80"

    depends_on:
      - django

    volumes:
      - static_volume:/vol/static
      - media_volume:/vol/media

    restart: unless-stopped

volumes:

  postgres_data:
  redis_data:
  static_volume:
  media_volume: